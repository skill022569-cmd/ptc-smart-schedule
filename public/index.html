<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตารางเรียน | PTC Smart Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="aurora"><span></span><span></span><span></span></div><div class="grid-bg"></div>
  <div id="preview-bar" class="preview-bar hidden no-print">👁 กำลังดูในมุมมอง <b>บุคคลทั่วไป</b> <a class="btn sm" href="/app.html">← กลับหน้าผู้ดูแลระบบ</a></div>
  <main class="main public">
    <header class="top">
      <div class="brand reveal" style="margin:0"><div class="logo">📅</div><div><h1>ตารางเรียน วิทยาลัยการอาชีพโพนทอง</h1><div class="muted" id="ver"></div></div></div>
      <div class="row no-print" style="flex:0 1 auto;justify-content:flex-end"><button class="btn ghost" id="guide-btn">📖 คู่มือการใช้งานเว็บเบื้องต้น</button><a class="btn ghost" href="/login.html" id="login-btn">🔐 เข้าสู่ระบบ</a></div>
    </header>
    <section class="card reveal" style="animation-delay:.1s">
      <div class="muted" style="margin-bottom:8px">เลือกแผนกวิชา</div>
      <div class="tabs" id="depts"></div>
      <div class="row" style="align-items:center;margin-bottom:12px">
        <div style="flex:2 1 220px"><label for="grp">กลุ่มเรียน</label><select id="grp"></select></div>
        <button class="btn ghost sm no-print" onclick="print()">🖨 พิมพ์ / PDF</button>
      </div>
      <div id="info" style="margin-bottom:10px"></div>
      <div id="grid"><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div>
      <p class="muted no-print" style="font-size:.8rem">แตะที่คาบเรียนเพื่อดูรายละเอียด</p>
    </section>
  </main>
  <script type="module" src="/js/public.js"></script>
</body>
</html>
