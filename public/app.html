<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTC Smart Schedule</title>
  <link rel="preload" href="/fonts/THSarabunPSK.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand"><img class="logo" src="/logo.png" alt="ตราวิทยาลัย" onerror="this.outerHTML='<div class=logo>วก.</div>'"><div><h1>วิทยาลัยการอาชีพโพนทอง</h1><div class="sub">ระบบจัดตารางเรียน-ตารางสอน</div></div></div>
      <nav class="nav" id="nav"></nav>
      <div style="margin-top:auto;display:grid;gap:8px"><button class="btn ghost" id="guide-btn" style="width:100%;justify-content:center">📖 คู่มือการใช้งานเว็บเบื้องต้น</button><button class="btn ghost" id="logout" style="width:100%;justify-content:center">ออกจากระบบ</button></div>
    </aside>
    <main class="main">
      <div id="viewas-bar" class="preview-bar hidden no-print" style="margin:-26px -36px 18px;border-radius:0"></div>
      <div class="top">
        <div style="display:flex;gap:12px;align-items:center;flex:1">
          <button class="btn ghost sm menu-btn" id="menu" aria-label="เมนู">☰</button>
          <h2 id="title"></h2>
        </div>
        <div class="viewas hidden no-print" id="viewas"></div>
        <div class="who"><div><div id="me-name" style="text-align:right"></div><div class="muted" id="me-role" style="font-size:.8rem;text-align:right"></div></div><div class="avatar" id="me-av"></div></div>
      </div>
      <div id="print-sheet" class="print-form print-only"></div>
      <div id="page"><div class="card"><div class="skeleton"></div><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:85%"></div></div></div>
    </main>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
